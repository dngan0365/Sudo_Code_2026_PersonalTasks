data:
  train_path: data/train-00000-of-00001.parquet
  valid_path: data/valid-00000-of-00001.parquet
  test_path: data/test-00000-of-00001.parquet
  content_column: Content
  summary_column: Summary
  train_limit: 5000
  valid_limit: 500
  test_limit: 500

preprocessing:
  lowercase: true
  max_source_tokens: 300
  max_target_tokens: 60

vocabulary:
  source_max_size: 30000
  target_max_size: 15000
  min_freq: 2

model:
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 1
  dropout: 0.2

training:
  batch_size: 32
  epochs: 5
  learning_rate: 0.001
  teacher_forcing_ratio: 0.5
  grad_clip: 5.0
  seed: 42
  device: auto

generation:
  max_summary_tokens: 80
  num_samples: 20

output:
  dir: output
