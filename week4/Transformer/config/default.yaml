data:
  corpus_dir: data/EVBCorpus_EVBNews_v2.0
  pattern: "*.sgml"
  source_lang: en
  target_lang: vn
  train_ratio: 0.8
  valid_ratio: 0.1
  max_pairs: 20000

preprocessing:
  lowercase: true
  max_source_tokens: 60
  max_target_tokens: 70

vocabulary:
  source_max_size: 20000
  target_max_size: 20000
  min_freq: 2

model:
  d_model: 256
  nhead: 4
  num_encoder_layers: 3
  num_decoder_layers: 3
  dim_feedforward: 512
  dropout: 0.1

training:
  batch_size: 32
  epochs: 5
  learning_rate: 0.0005
  grad_clip: 1.0
  seed: 42
  device: auto

generation:
  max_tokens: 80
  num_samples: 30

output:
  dir: output
